name: Neuro-Trap Threat Feed (Legacy)

# NOTE: This workflow is DISABLED. Its functionality is fully covered by
# deploy_threat_feed.yml which runs every 30 minutes and handles errors gracefully.
# Keeping this file for reference only. Use workflow_dispatch to run manually if needed.

on:
    # Disabled: was causing daily failure emails because it duplicates deploy_threat_feed.yml
    # schedule:
    #     - cron: "0 0 * * *"
    workflow_dispatch:
    # push:
    #     branches: [main]
    #     paths:
    #         - "logs/honeypot.json"

jobs:
    generate-feed:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Dependencies
              run: pip install pymongo dnspython certifi

            - name: Generate Threat Feed
              env:
                MONGODB_URI: ${{ secrets.MONGODB_URI }}
              run: python scripts/generate_threat_feed.py

            - name: Commit & Push Threat Feed
              run: |
                  git config user.name "Neuro-Trap Bot"
                  git config user.email "neurotrap@automated.feed"
                  git add threat_feed/
                  git diff --staged --quiet || git commit -m "🛡️ Auto-update threat feed [$(date -u +%Y-%m-%d)]"
                  git push
