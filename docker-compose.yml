# ============================================
# Neuro-Trap Docker Compose
# Orchestrates the Honeypot + Dashboard
# ============================================

version: "3.8"

services:
  # --- Core Honeypot SSH Server ---
  honeypot:
    build: .
    container_name: neuro-trap-honeypot
    env_file: .env
    ports:
      - "2222:2222"
    volumes:
      - ./logs:/app/logs
      - ./server/fs_state.json:/app/server/fs_state.json
    restart: unless-stopped
    command: python server/server.py

  # --- Threat Intelligence Dashboard ---
  dashboard:
    build: .
    container_name: neuro-trap-dashboard
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - honeypot
    restart: unless-stopped
    command: streamlit run dashboard.py --server.headless true --server.port 8501

  # --- Automated Threat Feed Generator ---
  threat-feed:
    build: .
    container_name: neuro-trap-feed
    env_file: .env
    volumes:
      - ./logs:/app/logs
      - ./threat_feed:/app/threat_feed
    depends_on:
      - honeypot
    # Runs once, generates the feed, and exits
    command: python scripts/generate_threat_feed.py

  # --- Enterprise: HTTP Honeypot (Web Scanner Trap) ---
  http-honeypot:
    build: .
    container_name: neuro-trap-http
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - honeypot
    restart: unless-stopped
    command: python server/http_honeypot.py

  # --- Enterprise: Telnet Honeypot (IoT Botnet Trap) ---
  telnet-honeypot:
    build: .
    container_name: neuro-trap-telnet
    env_file: .env
    ports:
      - "2323:2323"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - honeypot
    restart: unless-stopped
    command: python server/telnet_honeypot.py

  # --- Enterprise: FTP Honeypot (File Exfiltration Trap) ---
  ftp-honeypot:
    build: .
    container_name: neuro-trap-ftp
    env_file: .env
    ports:
      - "2121:2121"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - honeypot
    restart: unless-stopped
    command: python server/ftp_honeypot.py
